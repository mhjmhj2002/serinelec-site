
name: Deploy Preview (HML)

on:
  workflow_dispatch:
  push:
    branches: [hml]
    paths:
      - '*.html'
      - 'favicon.ico'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'api/**'
      - 'pt-br/**'
      - 'en/**'

permissions:
  contents: read

concurrency:
  group: serinelec-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via cPanel UAPI
        shell: bash
        env:
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN_HML }}
        run: |
          set -euo pipefail

          if [ -z "${CPANEL_TOKEN:-}" ]; then
            echo "Secret CPANEL_TOKEN_HML ausente"
            exit 1
          fi

          HOST="cpanel.serinelec.cl"
          IP="138.0.120.85"
          TARGET="public_html/preview.serinelec.cl"

          # Cria script verificador auxiliar em python
          cat << 'PYEOF' > /tmp/check_upload.py
          import sys, json

          filename = sys.argv[1] if len(sys.argv) > 1 else 'arquivo'
          raw = sys.stdin.read()
          try:
              r = json.loads(raw)
          except Exception:
              print(f"API nao retornou JSON valido. Resposta bruta: {raw[:300]}", file=sys.stderr)
              sys.exit(1)

          result = r.get("result", r)
          status = result.get("status")
          errors = result.get("errors") or r.get("errors")
          warnings = result.get("warnings") or result.get("messages")

          if status != 1 or errors:
              print(f"Upload rejeitado para {filename}:", file=sys.stderr)
              print(f"Status: {status}", file=sys.stderr)
              if errors:
                  print(f"Erros: {errors}", file=sys.stderr)
              if warnings:
                  print(f"Avisos/Mensagens: {warnings}", file=sys.stderr)
              print(f"Detalhes da resposta: {json.dumps(r, indent=2, ensure_ascii=False)}", file=sys.stderr)
              sys.exit(1)
          PYEOF

          # Envia varios arquivos de UMA pasta numa unica conexao (evita bloqueio por excesso de conexoes)
          upload_batch() {
            local subdir="$1"; shift
            local destination="$TARGET"
            [ "$subdir" != "." ] && destination="$TARGET/$subdir"
            [[ "$destination" != /* ]] && destination="/$destination"

            echo "Enviando $# arquivo(s) -> $destination"

            local args=() i=1 f
            for f in "$@"; do
              args+=(-F "file-$i=@$f;filename=$(basename "$f")")
              i=$((i+1))
            done

            local attempt response
            for attempt in 1 2 3 4 5; do
              if response="$(curl -sS --fail-with-body \
                --connect-timeout 30 --max-time 300 \
                --resolve "$HOST:443:$IP" \
                -H "Authorization: cpanel serinele:${CPANEL_TOKEN}" \
                -F "dir=$destination" \
                -F "overwrite=1" \
                "${args[@]}" \
                "https://$HOST/execute/Fileman/upload_files")"; then
                python3 /tmp/check_upload.py "$destination" <<< "$response"
                return 0
              fi
              echo "Tentativa $attempt falhou; aguardando $((attempt*20))s..."
              sleep $((attempt*20))
            done
            echo "Falha definitiva em $destination" >&2
            return 1
          }

          deploy_dir() {
            local dir="$1" exclude="${2:-}" d files
            while IFS= read -r -d '' d; do
              files=()
              while IFS= read -r -d '' f; do files+=("$f"); done \
                < <(find "$d" -maxdepth 1 -type f -print0 | sort -z)
              [ "${#files[@]}" -gt 0 ] && upload_batch "$d" "${files[@]}"
              sleep 3
            done < <(find "$dir" -type d -print0 | sort -z)
          }

          # Recursos primeiro, paginas depois.
          for directory in assets css js api pt-br en; do
            [ -d "$directory" ] || continue
            deploy_dir "$directory"
          done

          # Raiz: html (exceto index) + favicon, depois index por ultimo
          root_files=()
          for file in *.html; do
            [ -f "$file" ] || continue
            [ "$file" = "index.html" ] && continue
            root_files+=("$file")
          done
          [ -f favicon.ico ] && root_files+=(favicon.ico)
          [ "${#root_files[@]}" -gt 0 ] && upload_batch . "${root_files[@]}"
          sleep 3

          upload_batch . index.html

          echo "Deploy finalizado!"
